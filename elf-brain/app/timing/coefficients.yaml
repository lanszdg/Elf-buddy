# 时机引擎系数（docs/03 §3.2；Review 管线只改此文件不改代码——P0 手工维护）
state_factor:          # 状态适配系数
  transition: 1.0      # 黄金窗口
  idle: 0.7
  deep_work: 0.2
  busy: 0.0
  away: 0.0
  dnd: 0.0
timing_factor:         # 时段系数（0-23 时；24 小时补全，避免未列时段一律掉到 0.5 抑制分数）
  "0": 0.1
  "1": 0.1
  "2": 0.1
  "3": 0.1
  "4": 0.1
  "5": 0.1
  "6": 0.2
  "7": 0.4
  "8": 0.5
  "9": 0.6
  "10": 0.8
  "11": 0.8
  "12": 0.8
  "13": 0.6
  "14": 0.9
  "15": 1.0            # 下午间隙经验高峰
  "16": 1.0
  "17": 0.9
  "18": 0.8
  "19": 0.9
  "20": 0.95
  "21": 0.9
  "22": 0.7
  "23": 0.4
channel_threshold:     # 通道分数门槛
  L3: 0.65
  L2: 0.40
  L1: 0.20
daily_l3_quota: 3      # 每日主动开口硬上限
disturbance_step: 0.1  # 每开口一次打扰成本递增（0.15 对第二次开口压制过重）
trust_factor: 1.0      # P0 关系账户固定

normalization:         # expected_value 校准（docs/04 §1；phase=cold_start）
  version: 1
  phase: cold_start
  min_samples: 100
  anchors:
    - { score: -0.5, expected: 0.05 }
    - { score: 0.0,  expected: 0.15 }
    - { score: 0.3,  expected: 0.40 }
    - { score: 0.6,  expected: 0.65 }
    - { score: 1.0,  expected: 0.85 }
    - { score: 1.5,  expected: 0.95 }

seed_interests:        # P0 种子兴趣（docs/04 §2.5）
  - name: AI编程工具
    desc: AI 辅助编程、代码生成工具、开发者效率
  - name: 独立游戏
    desc: 独立游戏发售、预告、开发者日志
  - name: 咖啡
    desc: 精品咖啡、冲煮方法、器具
